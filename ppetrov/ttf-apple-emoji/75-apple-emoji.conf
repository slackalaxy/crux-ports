<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!--
    Make Apple Color Emoji the emoji font for all programs.

    Part 1: when a program asks for "emoji" in general, or for another
    emoji font by name, give it Apple Color Emoji instead. "strong" means
    this preference wins over the program's own request. Without these,
    some programs would show Microsoft (Segoe UI Emoji) or other styles.
  -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Noto Color Emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Segoe UI Emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Twitter Color Emoji</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <alias binding="strong">
    <family>Twemoji Mozilla</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <alias binding="strong">
    <family>JoyPixels</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <alias binding="strong">
    <family>EmojiOne Mozilla</family>
    <prefer><family>Apple Color Emoji</family></prefer>
  </alias>

  <!--
    Part 2: for normal text (sans-serif, serif, monospace), add Apple
    Color Emoji at the END of the list of fonts to try. Your text font
    (DejaVu) is still used for everything it has; only characters it
    lacks, such as emoji, are taken from Apple Color Emoji.
  -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="append" binding="weak">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

</fontconfig>
