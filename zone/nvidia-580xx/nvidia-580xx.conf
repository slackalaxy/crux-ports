# Settings for the proprietary NVIDIA driver (580xx, for Maxwell/Pascal/
# Volta cards). Installed by the nvidia-580xx port and removed with it.

# Stop the open nouveau driver from loading. The NVIDIA driver needs
# the card for itself, and the two can't drive it at the same time.
blacklist nouveau

# modeset=1: let the nvidia driver handle the display from boot on
#   (kernel modesetting), instead of only once X starts.
# fbdev=1: put the text console on the nvidia driver's framebuffer,
#   so it runs at the screen's real resolution instead of the low
#   mode the card's firmware offers to GRUB.
options nvidia-drm modeset=1 fbdev=1
