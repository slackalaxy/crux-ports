#
# /etc/firewall.conf
#
# By default, the firewall blocks ALL incoming connections from other
# computers. Your own use of the network (browsing, downloads, email,
# ports -u, ...) is outgoing and always works; you do not need to open
# anything for it.
#
# Only open something below if THIS machine runs a service that OTHER
# computers need to connect to.
#

# SSH: network interfaces on which other computers may log in to this
# machine with ssh (port 22), listed as an array. Leave it commented out
# to block incoming ssh completely. Find your interface names with: ip link
# CARDS=( eth0 wlan0 )

# Extra ports to open, listed as an array. Common ones:
#
#   80    web server, plain http://
#   443   web server, encrypted https:// (most websites today)
#   8080  a second or test web server (common convention, not a standard)
#   3838  Shiny Server (R web apps for other people)
#   8787  RStudio Server (RStudio used from another computer's browser)
#
# Example, for a web server with both http and https:
# TCP_PORTS=( 80 443 )
