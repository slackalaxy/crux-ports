  <!-- Colour emoji instead of black-and-white outlines.
       DejaVu (your default fonts) and Segoe UI Symbol (a black-and-white
       Microsoft symbol font from ttf-win11) contain outline versions of
       many emoji, e.g. the smiley faces. Fontconfig and Firefox use the
       first font that has a character, so these showed in black and white.
       The two rules below hide ONLY the emoji/pictograph area
       U+1F300-U+1FAFF (faces, animals, food, transport, ...) from these
       fonts, so it is taken from a colour emoji font instead.
       They deliberately do NOT touch U+2600-U+27BF: that area also holds
       document symbols (check marks, ballot boxes, arrows) used as bullet
       points, and hiding it broke bullets in word processors.
       There is one rule per font, because fontconfig does not support
       several names in one <test>.
       Run "fc-cache -f" after changing these ("scan" rules only take
       effect when the font cache is rebuilt). -->
  <match target="scan">
    <test name="family" compare="contains"><string>DejaVu</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x1F300</int><int>0x1FAFF</int></range>
        </charset>
      </minus>
    </edit>
  </match>
  <match target="scan">
    <test name="family" compare="contains"><string>Segoe UI Symbol</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
          <range><int>0x1F300</int><int>0x1FAFF</int></range>
        </charset>
      </minus>
    </edit>
  </match>


</fontconfig>
