<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <description>Add sans-serif to the family when no generic name</description>
<!--
  If the font still has no generic name, add sans-serif.
  This was the defail 49-sansserif.conf in fontconfig 2.17.1 (pre 2.18.0).
 -->
  <match target="pattern">
    <test qual="all" name="family" compare="not_eq">
      <string>sans-serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>serif</string>
    </test>
    <test qual="all" name="family" compare="not_eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append_last">
      <string>sans-serif</string>
    </edit>
  </match>

<!-- Set Serif, Sans and Mono -->
  <alias>
    <family>serif</family>
    <default><family>DejaVu Serif</family></default>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Bitstream Vera Serif</family>
    </prefer>
  </alias>
  
  <alias>
    <family>sans</family>
    <default><family>DejaVu Sans</family></default>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Bitstream Vera Sans</family>
    </prefer>
  </alias>
  
  <alias>
    <family>sans-serif</family>
    <default><family>DejaVu Sans</family></default>
    <prefer>
      <family>DejaVu Sans</family>
      <family>Bitstream Vera Sans</family>
    </prefer>
  </alias>

  <alias>
    <family>monospace</family>
    <default><family>DejaVu Sans Mono</family></default>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>Bitstream Vera Sans Mono</family>
    </prefer>
  </alias>
  
  <!-- Global rendering settings -->
  <!-- 
       hintnone, hintslight, hintmedium, hintfull
       rgb, vrgb, bgr, vbgr
       lcddefault, lcdlight, lcdlegacy
  -->
